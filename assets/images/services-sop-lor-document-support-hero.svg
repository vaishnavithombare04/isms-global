<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" aria-label="SOP, LOR, and Application Document Support with an ISMS Global Edu counsellor">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F4E" />
      <stop offset="100%" stop-color="#1A3570" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F7F8FC" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C41230" />
      <stop offset="100%" stop-color="#991022" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0B1F4E" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" rx="24" fill="url(#bgGrad)" />
  
  <!-- Decorative Elements -->
  <circle cx="120" cy="100" r="150" fill="#FFFFFF" opacity="0.03" />
  <circle cx="700" cy="500" r="180" fill="#C41230" opacity="0.1" />

  <!-- Main Window Card -->
  <rect x="60" y="60" width="680" height="480" rx="20" fill="url(#cardGrad)" filter="url(#shadow)"/>
  
  <!-- Title Bar -->
  <rect x="60" y="60" width="680" height="60" rx="20" fill="#0B1F4E"/>
  <circle cx="95" cy="90" r="6" fill="#FF5F56"/>
  <circle cx="115" cy="90" r="6" fill="#FFBD2E"/>
  <circle cx="135" cy="90" r="6" fill="#27C93F"/>
  <text x="400" y="95" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="14" font-weight="600" text-anchor="middle">ISMS Global Edu · SOP, LOR &amp; Document Review Portal</text>
  
  <!-- Left Side: Application Document Checklist -->
  <rect x="90" y="140" width="310" height="370" rx="14" fill="#FFFFFF" stroke="#EEF0F8" stroke-width="1.5"/>
  <text x="115" y="175" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="16" font-weight="700">Application Document Stack</text>
  
  <!-- Item 1: SOP -->
  <rect x="115" y="195" width="260" height="50" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <path d="M 135 220 L 142 225 L 155 212" stroke="#C41230" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="168" y="224" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Statement of Purpose (SOP)</text>

  <!-- Item 2: LOR -->
  <rect x="115" y="255" width="260" height="50" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <path d="M 135 280 L 142 285 L 155 272" stroke="#0B1F4E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="168" y="284" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Letter of Recommendation (LOR)</text>

  <!-- Item 3: Transcripts & CV -->
  <rect x="115" y="315" width="260" height="50" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <path d="M 135 340 L 142 345 L 155 332" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="168" y="344" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Transcripts &amp; Professional CV</text>

  <!-- Item 4: Passport & English Score -->
  <rect x="115" y="375" width="260" height="50" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <path d="M 135 400 L 142 405 L 155 392" stroke="#C41230" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="168" y="404" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Passport Copy &amp; Test Scores</text>

  <!-- Status pill -->
  <rect x="115" y="435" width="260" height="50" rx="8" fill="#FEF2F2" stroke="#FCA5A5"/>
  <text x="245" y="456" fill="#991B1B" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">ETHICAL REVIEW ASSISTANCE</text>
  <text x="245" y="472" fill="#7F1D1D" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Structure, clarity &amp; application alignment</text>

  <!-- Right Side: Hero Visual Card -->
  <rect x="420" y="140" width="290" height="370" rx="14" fill="#0B1F4E"/>
  
  <circle cx="565" cy="230" r="50" fill="url(#accentGrad)"/>
  <!-- Document File Icon -->
  <path d="M 550 212 H 572 L 580 220 V 248 H 550 Z M 556 224 H 574 M 556 232 H 574 M 556 240 H 568" stroke="#FFFFFF" stroke-width="2" fill="none"/>

  <text x="565" y="310" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="18" font-weight="700" text-anchor="middle">SOP &amp; LOR Support</text>
  <text x="565" y="335" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle">Transcripts · Passport · Resume</text>

  <rect x="450" y="375" width="230" height="44" rx="22" fill="#FFFFFF"/>
  <text x="565" y="402" fill="#C41230" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Book Free Counselling →</text>
  
  <text x="565" y="465" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">ISMS Global Edu Guidance</text>
</svg>
