<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="ieMapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F8FC"/>
      <stop offset="100%" stop-color="#EEF0F8"/>
    </linearGradient>
    <filter id="ieShadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B1F4E" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="800" height="520" rx="20" fill="url(#ieMapBg)"/>
  
  <!-- Central Map Container Card -->
  <rect x="80" y="40" width="640" height="440" rx="16" fill="#FFFFFF" stroke="#D9DCE8" stroke-width="1.5" filter="url(#ieShadow2)"/>
  
  <!-- Header Bar -->
  <rect x="80" y="40" width="640" height="70" rx="16" fill="#0B1F4E"/>
  <text x="400" y="83" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Top Student Cities in Ireland</text>
  
  <!-- Illustrative Ireland Map Outline Shape -->
  <g transform="translate(140, 130)">
    <!-- Stylized Ireland Geography outline path -->
    <path d="M 120 40 Q 150 20 180 50 Q 200 100 190 150 Q 210 200 180 250 Q 140 290 90 260 Q 60 220 70 170 Q 50 120 90 70 Q 90 40 120 40 Z" fill="#E6F4EA" stroke="#137333" stroke-width="2" stroke-dasharray="4,4"/>
    
    <!-- City Pins & Badges -->
    <!-- 1. Dublin (East / Capital) -->
    <circle cx="170" cy="140" r="10" fill="#0B1F4E"/>
    <circle cx="170" cy="140" r="5" fill="#FFFFFF"/>
    <text x="188" y="145" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="14" font-weight="900">Dublin (Capital Hub)</text>

    <!-- 2. Maynooth (Near Dublin) -->
    <circle cx="155" cy="125" r="7" fill="#137333"/>
    <text x="75" y="120" fill="#137333" font-family="'Inter', sans-serif" font-size="12" font-weight="800">Maynooth</text>

    <!-- 3. Galway (West Coast) -->
    <circle cx="100" cy="150" r="8" fill="#C41230"/>
    <text x="25" y="155" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="12" font-weight="800">Galway</text>

    <!-- 4. Limerick (Mid-West) -->
    <circle cx="105" cy="190" r="8" fill="#C41230"/>
    <text x="35" y="195" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="12" font-weight="800">Limerick</text>

    <!-- 5. Cork (South) -->
    <circle cx="120" cy="235" r="8" fill="#C41230"/>
    <text x="135" y="240" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="12" font-weight="800">Cork</text>
  </g>

  <!-- Right Side Summary Box -->
  <g transform="translate(470, 140)">
    <rect x="0" y="0" width="220" height="310" rx="12" fill="#F7F8FC" stroke="#EEF0F8"/>
    <text x="110" y="30" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Student Highlights</text>

    <text x="15" y="65" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• Tech &amp; Pharma Tech Hubs</text>
    <text x="15" y="95" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• Part-Time Work (20 hrs/wk)</text>
    <text x="15" y="125" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• 24-Mo Graduate Visa</text>
    <text x="15" y="155" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• Govt &amp; Merit Scholarships</text>
    <text x="15" y="185" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• Friendly &amp; Safe Cities</text>
    <text x="15" y="215" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• English Speaking Nation</text>

    <rect x="15" y="245" width="190" height="44" rx="8" fill="#137333"/>
    <text x="110" y="272" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Explore Ireland Campus Life</text>
  </g>
</svg>
