<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F8FC"/>
      <stop offset="100%" stop-color="#EEF0F8"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B1F4E" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="520" rx="20" fill="url(#bgGrad2)"/>
  
  <!-- Central Checklist Document Card (X: 110 to 690, Width: 580) -->
  <rect x="110" y="40" width="580" height="440" rx="16" fill="#FFFFFF" stroke="#D9DCE8" stroke-width="1.5" filter="url(#shadow2)"/>
  
  <!-- Header Bar of Document Card -->
  <rect x="110" y="40" width="580" height="74" rx="16" fill="#0B1F4E"/>
  <text x="400" y="85" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="0.3">Session Preparation &amp; Checklist</text>
  
  <!-- Document items -->
  <!-- Item 1 -->
  <circle cx="155" cy="150" r="14" fill="#C41230"/>
  <path d="M149 150 l4 4 l8 -8" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="185" y="155" fill="#111827" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="600">Academic Transcripts &amp; Mark Sheets</text>

  <!-- Item 2 -->
  <circle cx="155" cy="200" r="14" fill="#C41230"/>
  <path d="M149 200 l4 4 l8 -8" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="185" y="205" fill="#111827" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="600">Valid Passport Copy &amp; Resume / CV</text>

  <!-- Item 3 -->
  <circle cx="155" cy="250" r="14" fill="#C41230"/>
  <path d="M149 250 l4 4 l8 -8" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="185" y="255" fill="#111827" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="600">English Proficiency Test Scores (IELTS/PTE/TOEFL)</text>

  <!-- Item 4 -->
  <circle cx="155" cy="300" r="14" fill="#C41230"/>
  <path d="M149 300 l4 4 l8 -8" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="185" y="305" fill="#111827" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="600">Preferred Countries, Courses &amp; Budget Plan</text>

  <!-- Highlight Box at Bottom (X: 135 to 665, Width: 530) -->
  <rect x="135" y="360" width="530" height="90" rx="12" fill="#F5E6EA" stroke="#C41230" stroke-width="1.2"/>
  
  <!-- Vector Lightbulb Icon inside box -->
  <g transform="translate(155, 385)">
    <circle cx="20" cy="20" r="18" fill="#C41230"/>
    <!-- Lightbulb SVG paths -->
    <path d="M20 10 A 7 7 0 0 1 27 17 C 27 19.5 25.5 21.5 24 23 L 16 23 C 14.5 21.5 13 19.5 13 17 A 7 7 0 0 1 20 10 Z" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <path d="M17 26 h6 M18 28 h4" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Text inside Highlight Box -->
  <text x="210" y="402" fill="#991022" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="700">Expert Tip for Session Readiness</text>
  <text x="210" y="424" fill="#660B17" font-family="'Inter', -apple-system, sans-serif" font-size="12.5" font-weight="500">"Your counsellor will be better prepared to offer advice if you have these ready."</text>
</svg>
