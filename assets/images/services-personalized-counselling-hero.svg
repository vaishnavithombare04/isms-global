<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F4E" />
      <stop offset="100%" stop-color="#1A3570" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F7F8FC" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C41230" />
      <stop offset="100%" stop-color="#991022" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0B1F4E" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" rx="24" fill="url(#bgGrad)" />
  
  <!-- Decorative Grid & Spheres -->
  <circle cx="100" cy="100" r="140" fill="#FFFFFF" opacity="0.03" />
  <circle cx="720" cy="500" r="180" fill="#C41230" opacity="0.1" />
  <path d="M 50 200 Q 200 100 400 200 T 750 200" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- Dashboard Container Card -->
  <rect x="60" y="70" width="680" height="460" rx="20" fill="url(#cardGrad)" filter="url(#shadow)"/>
  
  <!-- Header Bar of Dashboard -->
  <rect x="60" y="70" width="680" height="64" rx="20" fill="#0B1F4E"/>
  <circle cx="95" cy="102" r="6" fill="#FF5F56"/>
  <circle cx="115" cy="102" r="6" fill="#FFBD2E"/>
  <circle cx="135" cy="102" r="6" fill="#27C93F"/>
  <text x="400" y="107" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="0.5">ISMS Global Edu · 1-on-1 Profile Assessment Portal</text>
  
  <!-- Left Column: Student Evaluation Progress -->
  <rect x="90" y="160" width="300" height="340" rx="14" fill="#FFFFFF" stroke="#EEF0F8" stroke-width="1.5"/>
  <text x="110" y="195" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="16" font-weight="700">Profile Evaluation Matrix</text>
  
  <!-- Evaluation Parameters -->
  <!-- 1. Academic Background -->
  <text x="110" y="235" fill="#374151" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Academic Background</text>
  <rect x="110" y="245" width="260" height="8" rx="4" fill="#EEF0F8"/>
  <rect x="110" y="245" width="235" height="8" rx="4" fill="url(#accentGrad)"/>
  <text x="345" y="235" fill="#C41230" font-family="'Inter', sans-serif" font-size="12" font-weight="700">90%</text>

  <!-- 2. Career Interests & Strengths -->
  <text x="110" y="285" fill="#374151" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Interests &amp; Future Goals</text>
  <rect x="110" y="295" width="260" height="8" rx="4" fill="#EEF0F8"/>
  <rect x="110" y="295" width="245" height="8" rx="4" fill="#0B1F4E"/>
  <text x="345" y="285" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="12" font-weight="700">95%</text>

  <!-- 3. Course Match Score -->
  <text x="110" y="335" fill="#374151" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Course &amp; University Match</text>
  <rect x="110" y="345" width="260" height="8" rx="4" fill="#EEF0F8"/>
  <rect x="110" y="345" width="250" height="8" rx="4" fill="#27C93F"/>
  <text x="345" y="335" fill="#27C93F" font-family="'Inter', sans-serif" font-size="12" font-weight="700">98%</text>

  <!-- Assessment Badge -->
  <rect x="110" y="380" width="260" height="95" rx="12" fill="#E8EDF8"/>
  <circle cx="140" cy="427" r="20" fill="#0B1F4E"/>
  <path d="M133 427 l5 5 l10 -10" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="172" y="418" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Qualified Destination Fit</text>
  <text x="172" y="438" fill="#6B7280" font-family="'Inter', sans-serif" font-size="12">UK · USA · Ireland · Australia</text>

  <!-- Right Column: Counsellor 1-on-1 session visual -->
  <rect x="410" y="160" width="300" height="340" rx="14" fill="#0B1F4E"/>
  
  <!-- Illustrative Icons & Interactive Cards -->
  <circle cx="560" cy="240" r="45" fill="#C41230"/>
  <!-- Graduation Cap Icon -->
  <path d="M560 220 L590 235 L560 250 L530 235 Z" fill="#FFFFFF"/>
  <path d="M542 242 v18 c0 6 18 10 18 10 s18 -4 18 -10 v-18" fill="none" stroke="#FFFFFF" stroke-width="2"/>

  <text x="560" y="315" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Personalized Counselling</text>
  <text x="560" y="338" fill="#E8EDF8" font-family="'Inter', sans-serif" font-size="13" text-anchor="middle">1-on-1 Expert Guidance Session</text>

  <!-- Action Pill -->
  <rect x="450" y="375" width="220" height="44" rx="22" fill="#FFFFFF"/>
  <text x="560" y="402" fill="#C41230" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Book Free Session →</text>
  
  <!-- Small floating verification badge -->
  <rect x="430" y="440" width="260" height="36" rx="8" fill="#FFFFFF" fill-opacity="0.1"/>
  <text x="560" y="463" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="500" text-anchor="middle">✓ Verified by Senior Study Abroad Counsellors</text>
</svg>
