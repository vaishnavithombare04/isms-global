<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="usMapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F8FC"/>
      <stop offset="100%" stop-color="#EEF0F8"/>
    </linearGradient>
    <filter id="usShadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B1F4E" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="800" height="520" rx="20" fill="url(#usMapBg)"/>
  
  <!-- Central Map Container Card -->
  <rect x="80" y="40" width="640" height="440" rx="16" fill="#FFFFFF" stroke="#D9DCE8" stroke-width="1.5" filter="url(#usShadow2)"/>
  
  <!-- Header Bar -->
  <rect x="80" y="40" width="640" height="70" rx="16" fill="#0B1F4E"/>
  <text x="400" y="83" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Top Student Hubs in the United States</text>
  
  <!-- Illustrative USA Map Outline Shape -->
  <g transform="translate(130, 130)">
    <!-- Stylized USA Geography outline path -->
    <path d="M 40 40 L 260 40 L 280 80 L 290 160 L 250 240 L 190 260 L 120 250 L 40 200 Z" fill="#E8EDF8" stroke="#0B1F4E" stroke-width="2" stroke-dasharray="4,4"/>
    
    <!-- City Pins & Badges -->
    <!-- 1. Boston & New York (East Coast) -->
    <circle cx="270" cy="85" r="9" fill="#C41230"/>
    <text x="285" y="90" fill="#C41230" font-family="'Inter', sans-serif" font-size="13" font-weight="900">Boston &amp; New York</text>

    <!-- 2. San Francisco / Silicon Valley (West Coast) -->
    <circle cx="50" cy="120" r="9" fill="#0B1F4E"/>
    <text x="10" y="105" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="13" font-weight="900">San Francisco / Bay Area</text>

    <!-- 3. Chicago (Midwest) -->
    <circle cx="200" cy="95" r="8" fill="#C41230"/>
    <text x="215" y="100" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="12" font-weight="800">Chicago</text>

    <!-- 4. Los Angeles (West Coast South) -->
    <circle cx="65" cy="180" r="8" fill="#C41230"/>
    <text x="15" y="200" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="12" font-weight="800">Los Angeles</text>

    <!-- 5. Austin / Texas (South) -->
    <circle cx="160" cy="210" r="8" fill="#C41230"/>
    <text x="175" y="215" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="12" font-weight="800">Austin, TX</text>
  </g>

  <!-- Right Side Summary Box -->
  <g transform="translate(470, 140)">
    <rect x="0" y="0" width="220" height="310" rx="12" fill="#F7F8FC" stroke="#EEF0F8"/>
    <text x="110" y="30" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle">USA Highlights</text>

    <text x="15" y="65" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• World Leader in Higher Ed</text>
    <text x="15" y="95" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• F-1 Visa &amp; SEVIS I-20</text>
    <text x="15" y="125" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• 36-Month STEM OPT Work</text>
    <text x="15" y="155" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• CPT Internship Rights</text>
    <text x="15" y="185" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• GRA &amp; GTA Assistantships</text>
    <text x="15" y="215" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• High Post-Grad Salaries</text>

    <rect x="15" y="245" width="190" height="44" rx="8" fill="#C41230"/>
    <text x="110" y="272" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Explore USA Options</text>
  </g>
</svg>
