<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%" aria-label="Icons supporting IELTS and English Test Preparation">
  <!-- Icon 1: IELTS Coaching -->
  <g transform="translate(20, 20)">
    <rect width="120" height="120" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="60" cy="60" r="30" fill="#FEF2F2"/>
    <text x="60" y="67" fill="#C41230" font-family="'Inter', sans-serif" font-size="16" font-weight="900" text-anchor="middle">IELTS</text>
    <text x="60" y="160" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">IELTS Coaching</text>
  </g>

  <!-- Icon 2: Learning Support -->
  <g transform="translate(170, 20)">
    <rect width="120" height="120" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="60" cy="60" r="30" fill="#EFF6FF"/>
    <path d="M 46 50 L 60 42 L 74 50 L 60 58 Z M 48 57 V 67 C 48 71 60 74 60 74 C 60 74 72 71 72 67 V 57" stroke="#0B1F4E" stroke-width="2.5" fill="none"/>
    <text x="60" y="160" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Learning Support</text>
  </g>

  <!-- Icon 3: Exam-Focused Prep -->
  <g transform="translate(320, 20)">
    <rect width="120" height="120" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="60" cy="60" r="30" fill="#ECFDF5"/>
    <circle cx="60" cy="60" r="16" stroke="#059669" stroke-width="3" fill="none"/>
    <circle cx="60" cy="60" r="6" fill="#059669"/>
    <text x="60" y="160" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Exam Focus</text>
  </g>

  <!-- Icon 4: English Score Card -->
  <g transform="translate(470, 20)">
    <rect width="120" height="120" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="60" cy="60" r="30" fill="#FFFBEB"/>
    <rect x="46" y="46" width="28" height="28" rx="4" stroke="#D97706" stroke-width="2.5" fill="none"/>
    <path d="M 52 58 L 57 63 L 68 52" stroke="#D97706" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <text x="60" y="160" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Score Card</text>
  </g>
</svg>
