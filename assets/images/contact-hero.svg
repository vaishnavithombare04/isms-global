<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F4E"/>
      <stop offset="50%" stop-color="#1A3570"/>
      <stop offset="100%" stop-color="#0B1F4E"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C41230"/>
      <stop offset="100%" stop-color="#FF5A75"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="640" x2="1200" y2="640"/>
    <line x1="240" y1="0" x2="240" y2="800"/>
    <line x1="480" y1="0" x2="480" y2="800"/>
    <line x1="720" y1="0" x2="720" y2="800"/>
    <line x1="960" y1="0" x2="960" y2="800"/>
  </g>

  <!-- Decorative Glowing Circles -->
  <circle cx="950" cy="200" r="300" fill="#C41230" fill-opacity="0.15" filter="blur(40px)"/>
  <circle cx="200" cy="650" r="250" fill="#1A3570" fill-opacity="0.25" filter="blur(50px)"/>

  <!-- Main Card Graphic -->
  <rect x="350" y="150" width="500" height="500" rx="24" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Brand Emblem Header -->
  <rect x="420" y="210" width="70" height="70" rx="18" fill="url(#accentGrad)"/>
  <text x="455" y="254" font-family="'Inter', sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle">IG</text>

  <!-- Card Lines & Text Mock -->
  <text x="510" y="240" font-family="'Inter', sans-serif" font-weight="800" font-size="24" fill="#FFFFFF">Contact Support</text>
  <text x="510" y="268" font-family="'Inter', sans-serif" font-weight="500" font-size="16" fill="#D9DCE8">ISMS Global Edu Advisors</text>

  <line x1="390" y1="310" x2="810" y2="310" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Interactive Contact Badges -->
  <g transform="translate(390, 340)">
    <rect width="420" height="60" rx="12" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <circle cx="35" cy="30" r="16" fill="#C41230"/>
    <text x="35" y="36" font-family="sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle">📞</text>
    <text x="70" y="35" font-family="'Inter', sans-serif" font-weight="600" font-size="16" fill="#FFFFFF">Free Counselling Hotline</text>
  </g>

  <g transform="translate(390, 420)">
    <rect width="420" height="60" rx="12" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <circle cx="35" cy="30" r="16" fill="#169B62"/>
    <text x="35" y="36" font-family="sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle">💬</text>
    <text x="70" y="35" font-family="'Inter', sans-serif" font-weight="600" font-size="16" fill="#FFFFFF">WhatsApp &amp; Live Chat Support</text>
  </g>

  <g transform="translate(390, 500)">
    <rect width="420" height="60" rx="12" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <circle cx="35" cy="30" r="16" fill="#3C3B6E"/>
    <text x="35" y="36" font-family="sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle">✉️</text>
    <text x="70" y="35" font-family="'Inter', sans-serif" font-weight="600" font-size="16" fill="#FFFFFF">Official Admission Guidance</text>
  </g>

  <text x="600" y="605" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#FF5A75" text-anchor="middle">100% Free · Verified Timelines · Transparent Guidance</text>
</svg>
