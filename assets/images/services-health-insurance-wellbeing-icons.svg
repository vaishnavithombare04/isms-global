<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%" aria-label="Icons supporting Health Insurance and Student Wellbeing">
  <!-- Icon 1: Health Insurance -->
  <g transform="translate(20, 20)">
    <rect width="120" height="120" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="60" cy="60" r="30" fill="#FEF2F2"/>
    <path d="M 60 48 C 54 40 44 48 60 68 C 76 48 66 40 60 48 Z" fill="#C41230"/>
    <text x="60" y="160" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Health Insurance</text>
  </g>

  <!-- Icon 2: Medical Support -->
  <g transform="translate(170, 20)">
    <rect width="120" height="120" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="60" cy="60" r="30" fill="#EFF6FF"/>
    <path d="M 52 60 H 68 M 60 52 V 68" stroke="#0B1F4E" stroke-width="4" stroke-linecap="round"/>
    <text x="60" y="160" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Medical Support</text>
  </g>

  <!-- Icon 3: Emergency Contacts -->
  <g transform="translate(320, 20)">
    <rect width="120" height="120" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="60" cy="60" r="30" fill="#ECFDF5"/>
    <path d="M 50 70 L 70 50 M 50 50 L 70 70" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
    <text x="60" y="160" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Emergency Contacts</text>
  </g>

  <!-- Icon 4: Psychological Safety & Wellbeing -->
  <g transform="translate(470, 20)">
    <rect width="120" height="120" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="60" cy="60" r="30" fill="#FFFBEB"/>
    <circle cx="60" cy="55" r="12" stroke="#D97706" stroke-width="2.5" fill="none"/>
    <path d="M 48 72 C 48 65 54 62 60 62 C 66 62 72 65 72 72" stroke="#D97706" stroke-width="2.5" fill="none"/>
    <text x="60" y="160" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Student Wellbeing</text>
  </g>
</svg>
