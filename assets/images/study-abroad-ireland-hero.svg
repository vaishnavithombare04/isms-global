<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="ieHeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F4E" />
      <stop offset="100%" stop-color="#1A3570" />
    </linearGradient>
    <linearGradient id="ieCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F7F8FC" />
    </linearGradient>
    <linearGradient id="ieGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#137333" />
      <stop offset="100%" stop-color="#0F5224" />
    </linearGradient>
    <filter id="ieShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0B1F4E" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="600" rx="24" fill="url(#ieHeroBg)" />
  
  <!-- Decorative Emerald Accents -->
  <circle cx="720" cy="120" r="180" fill="#137333" opacity="0.18" />
  <circle cx="80" cy="520" r="150" fill="#FFFFFF" opacity="0.04" />
  <path d="M 50 180 Q 250 80 500 180 T 750 120" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="3" stroke-dasharray="8,8"/>

  <!-- Dashboard Container Card -->
  <rect x="60" y="60" width="680" height="480" rx="20" fill="url(#ieCardGrad)" filter="url(#ieShadow)"/>
  
  <!-- Header Bar -->
  <rect x="60" y="60" width="680" height="64" rx="20" fill="#0B1F4E"/>
  <circle cx="95" cy="92" r="6" fill="#FF5F56"/>
  <circle cx="115" cy="92" r="6" fill="#FFBD2E"/>
  <circle cx="135" cy="92" r="6" fill="#27C93F"/>
  <text x="400" y="97" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="14" font-weight="600" text-anchor="middle">ISMS Global Edu · Study in Ireland Destination Guide</text>
  
  <!-- Left Side: 5 Key Pillars Grid -->
  <g transform="translate(90, 150)">
    <!-- Pillar 1: Top 3% Universities -->
    <rect x="0" y="0" width="310" height="64" rx="12" fill="#FFFFFF" stroke="#EEF0F8" stroke-width="1.5"/>
    <rect x="12" y="12" width="40" height="40" rx="8" fill="#E6F4EA"/>
    <text x="32" y="37" fill="#137333" font-size="18" font-weight="700" text-anchor="middle">🎓</text>
    <text x="64" y="32" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="13.5" font-weight="700">World's Top 3% Universities</text>
    <text x="64" y="48" fill="#137333" font-family="'Inter', sans-serif" font-size="11" font-weight="600">✓ Academic Excellence &amp; QS Ranked</text>

    <!-- Pillar 2: MNC Base -->
    <rect x="0" y="74" width="310" height="64" rx="12" fill="#FFFFFF" stroke="#EEF0F8" stroke-width="1.5"/>
    <rect x="12" y="86" width="40" height="40" rx="8" fill="#E8EDF8"/>
    <text x="32" y="111" fill="#0B1F4E" font-size="18" font-weight="700" text-anchor="middle">🏢</text>
    <text x="64" y="106" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="13.5" font-weight="700">MNC Hub of Europe</text>
    <text x="64" y="122" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="11" font-weight="600">✓ Google, Apple, Meta, Pfizer &amp; Intel</text>

    <!-- Pillar 3: 2-Year Graduate Scheme -->
    <rect x="0" y="148" width="310" height="64" rx="12" fill="#FFFFFF" stroke="#EEF0F8" stroke-width="1.5"/>
    <rect x="12" y="160" width="40" height="40" rx="8" fill="#E6F4EA"/>
    <text x="32" y="185" fill="#137333" font-size="18" font-weight="700" text-anchor="middle">🇮🇪</text>
    <text x="64" y="180" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="13.5" font-weight="700">Third Level Graduate Scheme</text>
    <text x="64" y="196" fill="#137333" font-family="'Inter', sans-serif" font-size="11" font-weight="600">✓ 24-Month Post-Study Work Permit</text>

    <!-- Pillar 4: English Speaking Nation -->
    <rect x="0" y="222" width="310" height="64" rx="12" fill="#FFFFFF" stroke="#EEF0F8" stroke-width="1.5"/>
    <rect x="12" y="234" width="40" height="40" rx="8" fill="#E8EDF8"/>
    <text x="32" y="259" fill="#0B1F4E" font-size="18" font-weight="700" text-anchor="middle">🗣️</text>
    <text x="64" y="254" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="13.5" font-weight="700">English-Speaking Country</text>
    <text x="64" y="270" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="11" font-weight="600">✓ Seamless Communication &amp; Adaptation</text>

    <!-- Pillar 5: Research & Innovation -->
    <rect x="0" y="296" width="310" height="64" rx="12" fill="#FFFFFF" stroke="#EEF0F8" stroke-width="1.5"/>
    <rect x="12" y="308" width="40" height="40" rx="8" fill="#E6F4EA"/>
    <text x="32" y="333" fill="#137333" font-size="18" font-weight="700" text-anchor="middle">🔬</text>
    <text x="64" y="328" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="13.5" font-weight="700">Innovation &amp; Practical Learning</text>
    <text x="64" y="344" fill="#137333" font-family="'Inter', sans-serif" font-size="11" font-weight="600">✓ World-Class R&amp;D Facilities</text>
  </g>

  <!-- Right Side: Ireland Feature Graphic -->
  <g transform="translate(420, 150)">
    <rect x="0" y="0" width="290" height="360" rx="16" fill="#0B1F4E"/>
    
    <!-- Shamrock / Crown Graphic -->
    <circle cx="145" cy="110" r="55" fill="#137333"/>
    <text x="145" y="122" fill="#FFFFFF" font-size="36" text-anchor="middle">☘️</text>

    <text x="145" y="195" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="20" font-weight="800" text-anchor="middle">Study in Ireland</text>
    <text x="145" y="220" fill="#E8EDF8" font-family="'Inter', sans-serif" font-size="13" text-anchor="middle">Your Path to Global Excellence</text>
    <text x="145" y="240" fill="#E8EDF8" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle">Dublin · Cork · Galway · Limerick</text>

    <!-- Callout pill -->
    <rect x="35" y="275" width="220" height="44" rx="22" fill="url(#ieGreenGrad)"/>
    <text x="145" y="302" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Apply for 2026 Intakes →</text>
  </g>
</svg>
