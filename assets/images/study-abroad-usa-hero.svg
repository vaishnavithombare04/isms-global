<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="usHeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F4E" />
      <stop offset="100%" stop-color="#1A3570" />
    </linearGradient>
    <linearGradient id="usCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F7F8FC" />
    </linearGradient>
    <linearGradient id="usRedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C41230" />
      <stop offset="100%" stop-color="#991022" />
    </linearGradient>
    <filter id="usShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0B1F4E" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="600" rx="24" fill="url(#usHeroBg)" />
  
  <!-- Decorative Accents -->
  <circle cx="720" cy="120" r="180" fill="#C41230" opacity="0.16" />
  <circle cx="80" cy="520" r="150" fill="#FFFFFF" opacity="0.04" />

  <!-- Main Container Card -->
  <rect x="60" y="60" width="680" height="480" rx="20" fill="url(#usCardGrad)" filter="url(#usShadow)"/>
  
  <!-- Header Bar -->
  <rect x="60" y="60" width="680" height="64" rx="20" fill="#0B1F4E"/>
  <circle cx="95" cy="92" r="6" fill="#FF5F56"/>
  <circle cx="115" cy="92" r="6" fill="#FFBD2E"/>
  <circle cx="135" cy="92" r="6" fill="#27C93F"/>
  <text x="400" y="97" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="14" font-weight="600" text-anchor="middle">ISMS Global Edu · Study in the USA Destination Guide</text>
  
  <!-- Left Side: 4 Source Benefits Grid -->
  <g transform="translate(90, 150)">
    <!-- Benefit 1: World-Renowned Universities -->
    <rect x="0" y="0" width="310" height="74" rx="12" fill="#FFFFFF" stroke="#EEF0F8" stroke-width="1.5"/>
    <rect x="12" y="15" width="44" height="44" rx="10" fill="#E8EDF8"/>
    <text x="34" y="43" fill="#0B1F4E" font-size="20" font-weight="700" text-anchor="middle">🏛️</text>
    <text x="68" y="36" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="14" font-weight="800">World-Renowned Universities</text>
    <text x="68" y="54" fill="#C41230" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600">Ivy League &amp; Top Global Rankings</text>

    <!-- Benefit 2: Good Research Facilities -->
    <rect x="0" y="86" width="310" height="74" rx="12" fill="#FFFFFF" stroke="#EEF0F8" stroke-width="1.5"/>
    <rect x="12" y="101" width="44" height="44" rx="10" fill="#F5E6EA"/>
    <text x="34" y="129" fill="#C41230" font-size="20" font-weight="700" text-anchor="middle">🔬</text>
    <text x="68" y="122" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="14" font-weight="800">Good Research Facilities</text>
    <text x="68" y="140" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600">Cutting-Edge Innovation &amp; R&amp;D</text>

    <!-- Benefit 3: Diverse Courses -->
    <rect x="0" y="172" width="310" height="74" rx="12" fill="#FFFFFF" stroke="#EEF0F8" stroke-width="1.5"/>
    <rect x="12" y="187" width="44" height="44" rx="10" fill="#E8EDF8"/>
    <text x="34" y="215" fill="#0B1F4E" font-size="20" font-weight="700" text-anchor="middle">🎓</text>
    <text x="68" y="208" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="14" font-weight="800">Diverse Courses</text>
    <text x="68" y="226" fill="#C41230" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600">STEM, Business, Arts &amp; Tech</text>

    <!-- Benefit 4: Good Salary Prospects -->
    <rect x="0" y="258" width="310" height="74" rx="12" fill="#FFFFFF" stroke="#EEF0F8" stroke-width="1.5"/>
    <rect x="12" y="273" width="44" height="44" rx="10" fill="#F5E6EA"/>
    <text x="34" y="301" fill="#C41230" font-size="20" font-weight="700" text-anchor="middle">💼</text>
    <text x="68" y="294" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="14" font-weight="800">Good Salary Prospects</text>
    <text x="68" y="312" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600">CPT &amp; 36-Month STEM OPT Rights</text>
  </g>

  <!-- Right Side: USA Feature Badge Card -->
  <g transform="translate(420, 150)">
    <rect x="0" y="0" width="290" height="360" rx="16" fill="#0B1F4E"/>
    
    <circle cx="145" cy="110" r="55" fill="#C41230"/>
    <text x="145" y="122" fill="#FFFFFF" font-size="36" text-anchor="middle">🗽</text>

    <text x="145" y="195" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="20" font-weight="800" text-anchor="middle">Study in the USA</text>
    <text x="145" y="220" fill="#E8EDF8" font-family="'Inter', sans-serif" font-size="13" text-anchor="middle">Global Leader in Higher Ed</text>
    <text x="145" y="240" fill="#E8EDF8" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle">Boston · New York · Bay Area · Chicago</text>

    <rect x="35" y="275" width="220" height="44" rx="22" fill="url(#usRedGrad)"/>
    <text x="145" y="302" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Book Free Counselling →</text>
  </g>
</svg>
