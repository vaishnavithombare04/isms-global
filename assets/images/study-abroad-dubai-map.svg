<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="dbMapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F8FC"/>
      <stop offset="100%" stop-color="#EEF0F8"/>
    </linearGradient>
    <filter id="dbShadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B1F4E" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="800" height="520" rx="20" fill="url(#dbMapBg)"/>
  
  <!-- Central Map Container Card -->
  <rect x="80" y="40" width="640" height="440" rx="16" fill="#FFFFFF" stroke="#D9DCE8" stroke-width="1.5" filter="url(#dbShadow2)"/>
  
  <!-- Header Bar -->
  <rect x="80" y="40" width="640" height="70" rx="16" fill="#0B1F4E"/>
  <text x="400" y="83" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Academic Hubs &amp; Free Zones in Dubai &amp; UAE</text>
  
  <!-- Illustrative Dubai & UAE Map Outline -->
  <g transform="translate(130, 130)">
    <path d="M 30 180 L 150 140 L 260 80 L 310 40 L 330 90 L 250 180 L 180 230 L 70 250 Z" fill="#E8EDF8" stroke="#0B1F4E" stroke-width="2" stroke-dasharray="4,4"/>

    <!-- Pins & Hubs -->
    <!-- 1. Dubai Knowledge Park -->
    <circle cx="150" cy="145" r="9" fill="#C41230"/>
    <text x="165" y="140" fill="#C41230" font-family="'Inter', sans-serif" font-size="13" font-weight="900">Dubai Knowledge Park</text>

    <!-- 2. Dubai International Academic City (DIAC) -->
    <circle cx="180" cy="175" r="9" fill="#0B1F4E"/>
    <text x="195" y="180" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="13" font-weight="900">Academic City (DIAC)</text>

    <!-- 3. Sharjah Academic City -->
    <circle cx="230" cy="110" r="8" fill="#C41230"/>
    <text x="245" y="115" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="12" font-weight="800">Sharjah Campus Zone</text>

    <!-- 4. Ras Al-Khaimah (RAK) -->
    <circle cx="295" cy="55" r="8" fill="#C41230"/>
    <text x="220" y="50" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="12" font-weight="800">Ras Al-Khaimah (RAK)</text>
  </g>

  <!-- Right Side Summary Box -->
  <g transform="translate(470, 140)">
    <rect x="0" y="0" width="220" height="310" rx="12" fill="#F7F8FC" stroke="#EEF0F8"/>
    <text x="110" y="30" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Dubai Key Highlights</text>

    <text x="15" y="65" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• 60+ Higher Ed Campuses</text>
    <text x="15" y="95" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• Int'l Branch Campuses</text>
    <text x="15" y="125" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• Paid &amp; Unpaid Internships</text>
    <text x="15" y="155" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• Tax-Free Career Growth</text>
    <text x="15" y="185" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• Year-Round Intakes</text>
    <text x="15" y="215" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• Safe &amp; Modern Lifestyle</text>

    <rect x="15" y="245" width="190" height="44" rx="8" fill="#C41230"/>
    <text x="110" y="272" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Book Free Counselling</text>
  </g>
</svg>
