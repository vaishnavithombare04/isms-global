<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="esMapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F8FC"/>
      <stop offset="100%" stop-color="#EEF0F8"/>
    </linearGradient>
    <filter id="esShadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B1F4E" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="800" height="520" rx="20" fill="url(#esMapBg)"/>
  
  <!-- Central Map Container Card -->
  <rect x="80" y="40" width="640" height="440" rx="16" fill="#FFFFFF" stroke="#D9DCE8" stroke-width="1.5" filter="url(#esShadow2)"/>
  
  <!-- Header Bar -->
  <rect x="80" y="40" width="640" height="70" rx="16" fill="#0B1F4E"/>
  <text x="400" y="83" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Top Student Cities &amp; Academic Centers in Spain</text>
  
  <!-- Illustrative Iberian Peninsula Map Outline -->
  <g transform="translate(140, 130)">
    <path d="M 40 30 L 180 20 L 260 40 L 280 120 L 240 210 L 140 240 L 40 200 Z" fill="#E8EDF8" stroke="#0B1F4E" stroke-width="2" stroke-dasharray="4,4"/>

    <!-- Pins & Cities -->
    <!-- 1. Madrid (Capital) -->
    <circle cx="150" cy="120" r="9" fill="#C41230"/>
    <text x="165" y="125" fill="#C41230" font-family="'Inter', sans-serif" font-size="14" font-weight="900">Madrid (Capital &amp; IE Uni)</text>

    <!-- 2. Barcelona -->
    <circle cx="230" cy="70" r="9" fill="#0B1F4E"/>
    <text x="245" y="75" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="13" font-weight="900">Barcelona (C3S, EAE, LCI)</text>

    <!-- 3. Valencia -->
    <circle cx="210" cy="140" r="7" fill="#C41230"/>
    <text x="225" y="145" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="12" font-weight="800">Valencia</text>

    <!-- 4. Seville & Granada -->
    <circle cx="100" cy="190" r="7" fill="#0B1F4E"/>
    <text x="115" y="195" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="12" font-weight="800">Seville &amp; Granada</text>

    <!-- 5. Murcia (UCAM) -->
    <circle cx="190" cy="180" r="7" fill="#C41230"/>
    <text x="205" y="185" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="12" font-weight="800">Murcia (UCAM)</text>
  </g>

  <!-- Right Side Summary Box -->
  <g transform="translate(470, 140)">
    <rect x="0" y="0" width="220" height="310" rx="12" fill="#F7F8FC" stroke="#EEF0F8"/>
    <text x="110" y="30" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Spain Key Highlights</text>

    <text x="15" y="65" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• Public &amp; Private Business Schools</text>
    <text x="15" y="95" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• English-Taught &amp; Bilingual Programs</text>
    <text x="15" y="125" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• Affordable Living &amp; Tuition</text>
    <text x="15" y="155" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• Erasmus+ &amp; Govt Scholarships</text>
    <text x="15" y="185" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• Sep &amp; Jan Major Intakes</text>
    <text x="15" y="215" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• Part-Time Work Rights</text>

    <rect x="15" y="245" width="190" height="44" rx="8" fill="#C41230"/>
    <text x="110" y="272" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Book Free Counselling</text>
  </g>
</svg>
