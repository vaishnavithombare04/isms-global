<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="frMapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F8FC"/>
      <stop offset="100%" stop-color="#EEF0F8"/>
    </linearGradient>
    <filter id="frShadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B1F4E" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="800" height="520" rx="20" fill="url(#frMapBg)"/>
  
  <!-- Central Map Container Card -->
  <rect x="80" y="40" width="640" height="440" rx="16" fill="#FFFFFF" stroke="#D9DCE8" stroke-width="1.5" filter="url(#frShadow2)"/>
  
  <!-- Header Bar -->
  <rect x="80" y="40" width="640" height="70" rx="16" fill="#0B1F4E"/>
  <text x="400" y="83" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Top Student Cities in France</text>
  
  <!-- Illustrative Hexagonal France Map Outline -->
  <g transform="translate(140, 130)">
    <polygon points="120,20 230,40 280,140 220,240 100,250 40,150" fill="#E8EDF8" stroke="#0B1F4E" stroke-width="2" stroke-dasharray="4,4"/>

    <!-- Pins & Cities -->
    <!-- 1. Paris -->
    <circle cx="160" cy="70" r="9" fill="#C41230"/>
    <text x="175" y="75" fill="#C41230" font-family="'Inter', sans-serif" font-size="14" font-weight="900">Paris (Capital &amp; Startup Hub)</text>

    <!-- 2. Lille -->
    <circle cx="170" cy="35" r="7" fill="#0B1F4E"/>
    <text x="185" y="40" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="12" font-weight="800">Lille</text>

    <!-- 3. Lyon -->
    <circle cx="210" cy="150" r="8" fill="#C41230"/>
    <text x="225" y="155" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="12" font-weight="800">Lyon</text>

    <!-- 4. Toulouse -->
    <circle cx="140" cy="210" r="8" fill="#0B1F4E"/>
    <text x="155" y="215" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="12" font-weight="800">Toulouse</text>

    <!-- 5. Marseille & Nice -->
    <circle cx="220" cy="215" r="8" fill="#C41230"/>
    <text x="235" y="220" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="12" font-weight="800">Marseille &amp; Nice</text>
  </g>

  <!-- Right Side Summary Box -->
  <g transform="translate(470, 140)">
    <rect x="0" y="0" width="220" height="310" rx="12" fill="#F7F8FC" stroke="#EEF0F8"/>
    <text x="110" y="30" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle">France Key Highlights</text>

    <text x="15" y="65" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• Public Unis &amp; Grandes Écoles</text>
    <text x="15" y="95" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• Highly Subsidized Tuition</text>
    <text x="15" y="125" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• Eiffel Excellence Scholarships</text>
    <text x="15" y="155" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• Strategic European Travel</text>
    <text x="15" y="185" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• Sep &amp; Jan Major Intakes</text>
    <text x="15" y="215" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• Part-Time Student Work</text>

    <rect x="15" y="245" width="190" height="44" rx="8" fill="#C41230"/>
    <text x="110" y="272" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Book Free Counselling</text>
  </g>
</svg>
