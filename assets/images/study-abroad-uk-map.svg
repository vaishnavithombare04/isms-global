<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="ukMapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F8FC"/>
      <stop offset="100%" stop-color="#EEF0F8"/>
    </linearGradient>
    <filter id="ukShadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B1F4E" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="800" height="520" rx="20" fill="url(#ukMapBg)"/>
  
  <!-- Central Map Container Card -->
  <rect x="80" y="40" width="640" height="440" rx="16" fill="#FFFFFF" stroke="#D9DCE8" stroke-width="1.5" filter="url(#ukShadow2)"/>
  
  <!-- Header Bar -->
  <rect x="80" y="40" width="640" height="70" rx="16" fill="#0B1F4E"/>
  <text x="400" y="83" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Top Student Cities in the United Kingdom</text>
  
  <!-- Illustrative UK Map Outline Shape -->
  <g transform="translate(140, 130)">
    <!-- Stylized UK Geography outline path -->
    <path d="M 120 40 Q 140 10 160 30 Q 180 80 170 120 Q 190 150 180 200 Q 210 240 170 280 Q 140 310 110 290 Q 70 270 80 220 Q 50 180 90 140 Q 80 80 120 40 Z" fill="#E8EDF8" stroke="#0B1F4E" stroke-width="2" stroke-dasharray="4,4"/>
    
    <!-- City Pins & Badges -->
    <!-- 1. Edinburgh & Glasgow (Scotland) -->
    <circle cx="130" cy="65" r="8" fill="#C41230"/>
    <text x="145" y="70" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="12" font-weight="800">Edinburgh &amp; Glasgow</text>

    <!-- 2. Leeds & Manchester (North) -->
    <circle cx="140" cy="140" r="8" fill="#C41230"/>
    <text x="155" y="145" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="12" font-weight="800">Leeds &amp; Manchester</text>

    <!-- 3. Birmingham (Midlands) -->
    <circle cx="135" cy="190" r="8" fill="#C41230"/>
    <text x="150" y="195" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="12" font-weight="800">Birmingham &amp; Warwick</text>

    <!-- 4. London (Capital) -->
    <circle cx="150" cy="240" r="10" fill="#0B1F4E"/>
    <circle cx="150" cy="240" r="5" fill="#FFFFFF"/>
    <text x="168" y="245" fill="#C41230" font-family="'Inter', sans-serif" font-size="14" font-weight="900">London (Capital Hub)</text>

    <!-- 5. Bristol & Cardiff (South West / Wales) -->
    <circle cx="110" cy="235" r="8" fill="#C41230"/>
    <text x="35" y="240" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="12" font-weight="800">Bristol &amp; Cardiff</text>
  </g>

  <!-- Right Side Summary Box -->
  <g transform="translate(470, 140)">
    <rect x="0" y="0" width="220" height="310" rx="12" fill="#F7F8FC" stroke="#EEF0F8"/>
    <text x="110" y="30" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Student Highlights</text>

    <text x="15" y="65" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• Vibrant Nightlife &amp; Cafés</text>
    <text x="15" y="95" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• Part-Time Work (20 hrs/wk)</text>
    <text x="15" y="125" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• Campus Clubs &amp; Societies</text>
    <text x="15" y="155" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• NHS Student Healthcare</text>
    <text x="15" y="185" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• Travel Across UK &amp; Europe</text>
    <text x="15" y="215" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• Global Career Networks</text>

    <rect x="15" y="245" width="190" height="44" rx="8" fill="#0B1F4E"/>
    <text x="110" y="272" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Explore UK Campus Life</text>
  </g>
</svg>
