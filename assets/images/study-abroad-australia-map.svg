<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="auMapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F8FC"/>
      <stop offset="100%" stop-color="#EEF0F8"/>
    </linearGradient>
    <filter id="auShadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B1F4E" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="800" height="520" rx="20" fill="url(#auMapBg)"/>
  
  <!-- Central Map Container Card -->
  <rect x="80" y="40" width="640" height="440" rx="16" fill="#FFFFFF" stroke="#D9DCE8" stroke-width="1.5" filter="url(#auShadow2)"/>
  
  <!-- Header Bar -->
  <rect x="80" y="40" width="640" height="70" rx="16" fill="#0B1F4E"/>
  <text x="400" y="83" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Top Student Cities in Australia</text>
  
  <!-- Illustrative Australia Map Outline Shape -->
  <g transform="translate(130, 130)">
    <!-- Stylized Australia Geography outline path -->
    <path d="M 120 30 Q 180 20 220 50 Q 250 80 260 140 Q 270 200 240 240 Q 180 270 120 260 Q 60 250 40 180 Q 30 110 70 60 Q 90 30 120 30 Z" fill="#E8EDF8" stroke="#0B1F4E" stroke-width="2" stroke-dasharray="4,4"/>
    
    <!-- City Pins & Badges -->
    <!-- 1. Sydney (East Coast) -->
    <circle cx="230" cy="180" r="10" fill="#C41230"/>
    <circle cx="230" cy="180" r="5" fill="#FFFFFF"/>
    <text x="245" y="185" fill="#C41230" font-family="'Inter', sans-serif" font-size="13" font-weight="900">Sydney (Business Hub)</text>

    <!-- 2. Melbourne (South East) -->
    <circle cx="210" cy="220" r="9" fill="#0B1F4E"/>
    <circle cx="210" cy="220" r="4.5" fill="#FFFFFF"/>
    <text x="225" y="225" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="13" font-weight="900">Melbourne</text>

    <!-- 3. Brisbane (North East) -->
    <circle cx="240" cy="130" r="8" fill="#C41230"/>
    <text x="255" y="135" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="12" font-weight="800">Brisbane</text>

    <!-- 4. Adelaide (South) -->
    <circle cx="170" cy="205" r="8" fill="#C41230"/>
    <text x="95" y="225" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="12" font-weight="800">Adelaide</text>

    <!-- 5. Perth (West Coast) -->
    <circle cx="65" cy="190" r="8" fill="#C41230"/>
    <text x="10" y="195" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="12" font-weight="800">Perth</text>

    <!-- 6. Canberra (Capital) -->
    <circle cx="215" cy="198" r="7" fill="#0B1F4E"/>
    <text x="140" y="180" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="11" font-weight="800">Canberra</text>
  </g>

  <!-- Right Side Summary Box -->
  <g transform="translate(470, 140)">
    <rect x="0" y="0" width="220" height="310" rx="12" fill="#F7F8FC" stroke="#EEF0F8"/>
    <text x="110" y="30" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Student Highlights</text>

    <text x="15" y="65" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• 5 Cities in World's Top 30</text>
    <text x="15" y="95" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• 48 Hrs / Fortnight Work</text>
    <text x="15" y="125" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• Subclass 500 Visa Rights</text>
    <text x="15" y="155" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• AAS &amp; RTP Scholarships</text>
    <text x="15" y="185" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• High Quality of Living</text>
    <text x="15" y="215" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• Industry &amp; Practical Focus</text>

    <rect x="15" y="245" width="190" height="44" rx="8" fill="#C41230"/>
    <text x="110" y="272" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Explore Australia Cities</text>
  </g>
</svg>
