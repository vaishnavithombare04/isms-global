<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <rect width="800" height="400" fill="#0B1F4E" rx="16"/>
  <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Icon 1: Counselling -->
    <circle cx="200" cy="150" r="40" stroke="#C41230" stroke-width="6"/>
    <path d="M180 150h40M200 130v40"/>
    <text x="200" y="240" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Personalised Counselling</text>
    
    <!-- Icon 2: Trust -->
    <circle cx="400" cy="150" r="40" stroke="#FF6B81" stroke-width="6"/>
    <path d="M380 150l15 15 25-25"/>
    <text x="400" y="240" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">17 Years Trust</text>
    
    <!-- Icon 3: Free Service -->
    <circle cx="600" cy="150" r="40" stroke="#C41230" stroke-width="6"/>
    <text x="600" y="160" font-family="Arial, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">FREE</text>
    <text x="600" y="240" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">100% Free Sessions</text>
