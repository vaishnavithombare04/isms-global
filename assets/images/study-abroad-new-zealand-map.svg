<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="nzMapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F8FC"/>
      <stop offset="100%" stop-color="#EEF0F8"/>
    </linearGradient>
    <filter id="nzShadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B1F4E" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="800" height="520" rx="20" fill="url(#nzMapBg)"/>
  
  <!-- Central Map Container Card -->
  <rect x="80" y="40" width="640" height="440" rx="16" fill="#FFFFFF" stroke="#D9DCE8" stroke-width="1.5" filter="url(#nzShadow2)"/>
  
  <!-- Header Bar -->
  <rect x="80" y="40" width="640" height="70" rx="16" fill="#0B1F4E"/>
  <text x="400" y="83" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Top Student Cities in New Zealand</text>
  
  <!-- Illustrative New Zealand North & South Island Shapes -->
  <g transform="translate(140, 130)">
    <!-- North Island -->
    <path d="M 120 20 C 150 10, 190 30, 200 60 C 210 90, 180 120, 150 130 C 130 120, 100 80, 120 20 Z" fill="#E8EDF8" stroke="#0B1F4E" stroke-width="2" stroke-dasharray="4,4"/>
    
    <!-- South Island -->
    <path d="M 80 140 C 120 130, 150 170, 130 220 C 110 260, 60 270, 40 230 C 30 180, 60 150, 80 140 Z" fill="#E8EDF8" stroke="#0B1F4E" stroke-width="2" stroke-dasharray="4,4"/>

    <!-- City Pins & Badges -->
    <!-- 1. Auckland -->
    <circle cx="165" cy="45" r="9" fill="#C41230"/>
    <text x="180" y="50" fill="#C41230" font-family="'Inter', sans-serif" font-size="13" font-weight="900">Auckland</text>

    <!-- 2. Hamilton -->
    <circle cx="155" cy="75" r="7" fill="#0B1F4E"/>
    <text x="170" y="80" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="12" font-weight="800">Hamilton</text>

    <!-- 3. Wellington -->
    <circle cx="130" cy="120" r="9" fill="#C41230"/>
    <text x="145" y="125" fill="#C41230" font-family="'Inter', sans-serif" font-size="13" font-weight="900">Wellington</text>

    <!-- 4. Christchurch -->
    <circle cx="95" cy="180" r="8" fill="#0B1F4E"/>
    <text x="110" y="185" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="12" font-weight="800">Christchurch</text>

    <!-- 5. Dunedin -->
    <circle cx="65" cy="235" r="8" fill="#C41230"/>
    <text x="80" y="240" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="12" font-weight="800">Dunedin</text>
  </g>

  <!-- Right Side Summary Box -->
  <g transform="translate(470, 140)">
    <rect x="0" y="0" width="220" height="310" rx="12" fill="#F7F8FC" stroke="#EEF0F8"/>
    <text x="110" y="30" fill="#0B1F4E" font-family="'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle">New Zealand Key Facts</text>

    <text x="15" y="65" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• Top 3% Global Universities</text>
    <text x="15" y="95" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• Up to 3 Years Work Visa</text>
    <text x="15" y="125" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• #4 in Quality of Life</text>
    <text x="15" y="155" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• 2 Main Intakes (Feb &amp; Jul)</text>
    <text x="15" y="185" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• Part-Time Student Work</text>
    <text x="15" y="215" fill="#111827" font-family="'Inter', sans-serif" font-size="12" font-weight="700">• Outdoor Kiwi Lifestyle</text>

    <rect x="15" y="245" width="190" height="44" rx="8" fill="#C41230"/>
    <text x="110" y="272" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Book Free Counselling</text>
  </g>
</svg>
